    <div class="row wrap"><button class="btn" id="btn-new"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>크루 만들기</button><a class="btn line" href="crew-admin.html">크루 관리 콘솔</a></div>

      <div style="flex:1;min-width:240px"><h3>매너 크루 인증</h3><p class="small muted mt8">함께 달리기 원칙을 지키고, 6명 이상 모임을 소그룹으로 운영하며, 최근 석 달 동안 매너 위반 신고가 없는 크루에 붙는 표시예요.</p></div>
