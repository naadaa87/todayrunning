<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>모임 상세 · 오늘러닝</title>
<meta name="description" content="모임 일정, 코스, 페이스 그룹, 장소 규칙, 날씨를 확인하고 신청하세요.">
<meta name="theme-color" content="#ffffff">
<meta property="og:title" content="모임 상세 · 오늘러닝">
<meta property="og:description" content="모임 일정, 코스, 페이스 그룹, 장소 규칙, 날씨를 확인하고 신청하세요.">
<meta property="og:type" content="website">
<meta property="og:locale" content="ko_KR">
<meta property="og:image" content="assets/img/og.png">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/img/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="meetup" data-nav="meetups">
<main id="main">
<div class="container">
  <div class="page-head" style="padding-bottom:16px">
    <a class="small muted" href="meetups.html">← 모임 찾기</a>
    <div class="chips mt12" id="m-chips"></div>
    <h1 id="m-title">모임</h1>
    <p id="m-sub"></p>
  </div>
  <div id="m-banner"></div>
  <div class="detail">
    <div class="stack">
      <div id="m-map" class="map"></div>
      <div class="grid c4" id="m-stats"></div>
      <div id="m-note"></div>

      <section class="card" id="apply-card">
        <div class="row between"><h3>페이스 그룹</h3><span class="small muted">그룹마다 5명 이하로 출발해요</span></div>
        <div id="m-groups" class="mt8"></div>
        <details class="mt16" id="m-principles"><summary class="strong" style="cursor:pointer">함께 달리기 원칙 보기</summary><ol class="mt8 small" style="padding-left:20px"></ol></details>
        <label class="check mt16"><input type="checkbox" id="agree"><span>함께 달리기 원칙과 안전 수칙을 확인했고, 모임 중 사고에 대비해 몸 상태를 스스로 점검하겠습니다.</span></label>
        <div class="mt16" id="apply-box"></div>
        <p class="xsmall muted mt8">연락처는 운영진에게만 보여요. 앱을 설치하지 않아도 웹에서 신청할 수 있어요.</p>
      </section>

      <section id="m-stores"></section>
    </div>

    <aside class="stack sticky">
      <div class="card">
        <dl class="kv" id="m-kv"></dl>
        <div class="row wrap mt16">
          <button class="btn line sm" id="btn-share"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"/></svg>공유</button>
          <button class="btn line sm" id="btn-ics"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>캘린더에 추가</button>
        </div>
      </div>
      <div class="card" id="m-wx"></div>
      <div class="card" id="m-attend">
        <h3>출석하기</h3>
        <p class="small muted mt8">모임 장소에서 운영진이 보여 주는 6자리 코드를 입력하세요. 코드는 30초마다 바뀌어요.</p>
        <div class="row mt12"><input class="input" id="att-code" inputmode="numeric" maxlength="6" placeholder="000000" style="letter-spacing:.3em;text-align:center;font-weight:800"><button class="btn" id="att-btn">출석</button></div>
        <div id="att-result" class="mt8 small"></div>
      </div>
      <a class="btn dark block" id="m-admin" href="crew-admin.html">운영진: 출석·귀환 관리</a>
    </aside>
  </div>
</div>
</main>
<script src="assets/vendor/leaflet/leaflet.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/pages/meetup.js"></script>
</body>
</html>
