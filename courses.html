<body data-page="courses" data-nav="courses">
<main id="main">
<div class="container">
  <div class="page-head">
    <span class="eyebrow">Courses</span>
    <h1>코스 찾기</h1>
    <p>거리와 오르막, 화장실·AED·보관함, 그리고 장소 규칙을 한 번에 보세요. 마음에 드는 코스로 바로 모임을 열 수 있어요.</p>
    <div class="row wrap"><a class="btn" href="course-builder.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18H15a3 3 0 000-6H9a3 3 0 010-6h6.5"/></svg>코스 짜기</a></div>
  </div>
  <div class="filters" id="filters">
    <select class="select" id="f-region" aria-label="지역"></select>
    <select class="select" id="f-type" aria-label="형태"><option value="">모든 형태</option><option>순환</option><option>왕복</option></select>
    <select class="select" id="f-dist" aria-label="거리"><option value="">모든 거리</option><option value="0-3">3km 이하</option><option value="3-5">3~5km</option><option value="5-99">5km 이상</option></select>
    <label class="toggle-chip"><input type="checkbox" id="f-night">야간 조명</label>
    <label class="toggle-chip"><input type="checkbox" id="f-locker">보관함</label>
    <label class="toggle-chip"><input type="checkbox" id="f-mine">내 코스</label>
  </div>
  <div class="split mt24">
    <div class="scroll" id="list"></div>
    <div><div id="map" class="map tall"></div><p class="xsmall muted mt8">경로는 예시예요. 실제 길과 다를 수 있어요.</p></div>
  </div>
</div>
